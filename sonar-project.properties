sonar.projectKey=Cooooooler_base_nest
sonar.organization=cooooooler

# ===== Metadata =====
sonar.projectName=base_nest
sonar.projectVersion=1.0

# ===== Source =====
sonar.sources=apps/api/src,apps/web/src,packages/shared/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/.next/**,**/coverage/**,**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx

# ===== Tests =====
sonar.tests=apps/api/src,apps/web/src,packages/shared/src
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx

# ===== Coverage =====
sonar.javascript.lcov.reportPaths=apps/api/coverage/lcov.info,apps/web/coverage/lcov.info
sonar.coverage.exclusions=\
  **/*.spec.ts,**/*.e2e-spec.ts,**/*.test.ts,**/*.test.tsx,\
  **/*.module.ts,**/main.ts,**/index.ts,**/__tests__/**,\
  **/*.config.ts,**/*.config.mjs,**/*.mock.ts,**/*.setup.ts,\
  **/components/ui/**,\
  **/app/**,\
  **/components/animated/**,\
  **/components/chat/**,\
  **/components/workflow/**,\
  **/common/vectore-store/**,\
  **/components/app/markdown-renderer.tsx,\
  **/api/client.ts
# ===== Encoding =====
sonar.sourceEncoding=UTF-8
