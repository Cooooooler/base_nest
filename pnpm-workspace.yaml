packages:
  - 'apps/*'
  - 'packages/*'

catalog:
  # TypeScript
  typescript: ^5.7.3

  # NestJS common runtime deps
  reflect-metadata: ^0.2.2
  rxjs: ^7.8.1

  # Linting / Formatting
  prettier: ^3.4.2
  eslint: ^9.39.4
  eslint-config-prettier: ^10.0.1
  eslint-plugin-prettier: ^5.2.2
  globals: ^17.0.0
  typescript-eslint: ^8.20.0
  eslint-config-next: 16.2.9

  # Testing
  jest: ^30.4.2
  ts-jest: ^29.4.11
  '@types/jest': ^30.0.0

  # Node types
  '@types/node': ^24

  # React / UI shared deps
  react: ^19
  react-dom: ^19
  '@types/react': ^19
  '@types/react-dom': ^19
  clsx: ^2
  tailwind-merge: ^2
  class-variance-authority: ^0.7
  cmdk: ^1.1.1
  lucide-react: ^0.400
  ahooks: ^3.9.7
  '@base-ui/react': ^1.5.0
  next-themes: ^0.4.6
  sonner: ^2.0.7
  '@tanstack/react-table': ^8.21.3

  # Monorepo tooling
  turbo: ^2.9.18
  husky: ^9.1.7
