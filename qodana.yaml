#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#

version: '1.0'

# Use recommended profile (covers WebStorm default inspections)
profile:
  name: qodana.recommended

# === Additional Inspections ===
include:
  # ── Code Quality Tools ───────────────────────────────────────────────────
  - name: Eslint
  - name: TsLint

  # ── Probable Bugs ────────────────────────────────────────────────────────
  - name: JSIncompatibleTypesComparison
  - name: JSComparisonWithNaN
  - name: JSEqualityComparisonWithCoercion
  - name: DivideByZeroJS
  - name: InfiniteLoopJS
  - name: InfiniteRecursionJS
  - name: JSPotentiallyInvalidUsageOfThis
  - name: JSPotentiallyInvalidUsageOfClassThis
  - name: JSPotentiallyInvalidTargetOfIndexedPropertyAccess
  - name: JSPotentiallyInvalidConstructorUsage
  - name: JSSuspiciousEqPlus
  - name: JSSuspiciousNameCombination
  - name: JSVoidFunctionReturnValueUsed
  - name: ES6BindWithArrowFunction
  - name: ObjectAllocationIgnored
  - name: JSTypeOfValues
  - name: ForLoopThatDoesntUseLoopVariableJS

  # ── TypeScript ───────────────────────────────────────────────────────────
  - name: TypeScriptValidateTypes
  - name: TypeScriptValidateGenericTypes
  - name: TypeScriptUnresolvedReference
  - name: TypeScriptCheckImport
  - name: TypeScriptDuplicateUnionOrIntersectionType
  - name: TypeScriptRedundantGenericType
  - name: TypeScriptFieldCanBeMadeReadonly
  - name: TypeScriptSmartCast
  - name: TypeScriptAbstractClassConstructorCanBeMadeProtected
  - name: TypeScriptExplicitMemberType
  - name: TypeScriptSuspiciousConstructorParameterAssignment
  - name: TypeScriptConfig
  - name: TypeScriptMissingConfigOption
  - name: TypeScriptLibrary
  - name: TypeScriptMissingAugmentationImport

  # ── Unused Symbols ──────────────────────────────────────────────────────
  - name: JSUnusedGlobalSymbols
  - name: JSUnusedLocalSymbols
  - name: JSUnusedAssignment
  - name: ES6UnusedImports

  # ── Async Code & Promises ───────────────────────────────────────────────
  - name: ES6PossiblyAsyncFunction
  - name: ES6MissingAwait
  - name: ES6RedundantAwait
  - name: JSIgnoredPromiseFromCall

  # ── Imports & Dependencies ──────────────────────────────────────────────
  - name: NpmUsedModulesInstalled
  - name: PackageJsonMismatchedDependency
  - name: UpdateDependencyToLatestVersion
  - name: CheckDependencyLicenses

  # ── Security ────────────────────────────────────────────────────────────
  - name: NpmVulnerableApiCode
  - name: DynamicallyGeneratedCodeJS

  # ── Validity Issues ─────────────────────────────────────────────────────
  - name: JSDeprecatedSymbols
  - name: JSConstantReassignment
  - name: BadExpressionStatementJS
  - name: FunctionWithInconsistentReturnsJS
  - name: ThisExpressionReferencesGlobalObjectJS
  - name: JSDuplicatedDeclaration
  - name: JSUndeclaredVariable
  - name: UnreachableCodeJS
  - name: ConstantConditionalExpressionJS

  # ── Control Flow ────────────────────────────────────────────────────────
  - name: IfStatementWithIdenticalBranchesJS
  - name: ConditionalExpressionWithIdenticalBranchesJS
  - name: DuplicateConditionJS
  - name: PointlessBooleanExpressionJS
  - name: RedundantIfStatementJS
  - name: SuspiciousTypeOfGuard
  - name: TailRecursionJS

  # ── Function Metrics ────────────────────────────────────────────────────
  - name: CyclomaticComplexityJS
  - name: FunctionTooLongJS
  - name: OverlyNestedFunctionJS
  - name: ParametersPerFunctionJS

  # ── Switch Statement ────────────────────────────────────────────────────
  - name: JSMissingSwitchDefault
  - name: JSMissingSwitchBranches
  - name: JSDuplicateCaseLabel
  - name: FallThroughInSwitchStatementJS
  - name: JSUnreachableSwitchBranches
  - name: JSSwitchVariableDeclarationIssue

  # ── Try Statement ───────────────────────────────────────────────────────
  - name: EmptyCatchBlockJS
  - name: ExceptionCaughtLocallyJS
  - name: UnusedCatchParameterJS
  - name: ReturnInsideFinallyBlockJS
  - name: ThrowInsideFinallyBlockJS
  - name: ContinueOrBreakFromFinallyBlockJS

  # ── ES2015 Migration / Modern JS ────────────────────────────────────────
  - name: ES6ConvertVarToLetConst
  - name: ES6ConvertLetToConst
  - name: ES6ShorthandObjectProperty
  - name: JSStringConcatenationToES6Template
  - name: JSFunctionExpressionToArrowFunction
  - name: ES6ConvertToForOf
  - name: ES6ConvertIndexedForToForOf
  - name: ES6DestructuringVariablesMerge

  # ── React (JSX) ────────────────────────────────────────────────────────
  - name: JSXDomNesting
  - name: JSXSyntaxUsed
  - name: JSXUnresolvedComponent

  # ── Data Flow ───────────────────────────────────────────────────────────
  - name: UnnecessaryLocalVariableJS
  - name: ReuseOfLocalVariableJS

  # ── Naming Conventions ──────────────────────────────────────────────────
  - name: JSClassNamingConvention
  - name: FunctionNamingConventionJS

  # ── Potentially Confusing Code ─────────────────────────────────────────
  - name: MagicNumberJS
  - name: StatementWithEmptyBodyJS
  - name: BlockStatementJS
  - name: OverlyComplexBooleanExpressionJS
  - name: OverlyComplexArithmeticExpressionJS
  - name: NegatedIfStatementJS
  - name: NegatedConditionalExpressionJS
  - name: ConfusingFloatingPointLiteralJS
  - name: NestedConditionalExpressionJS

  # ── Potentially Undesirable Code ────────────────────────────────────────
  - name: DebuggerStatementJS
  - name: WithStatementJS

  # ── DOM Issues ──────────────────────────────────────────────────────────
  - name: InnerHTMLJS

# === Exclusions ===
exclude:
  - name: All
    paths:
      - node_modules
      - dist
      - .next
      - coverage
      - '*.svg'
      - '*.png'
      - '*.jpg'
      - '*.jpeg'
      - '*.gif'
      - '*.ico'
      - '*.woff2'
      - '*.woff'
      - '*.ttf'
      - '*.eot'
      - .github
      - .husky
      - .vscode

  # NestJS decorator false positives
  - name: JSUnusedGlobalSymbols
    paths:
      - apps/api/src/*.module.ts
      - apps/api/src/main.ts

  # Test file noise
  - name: JSUnusedGlobalSymbols
    paths:
      - '**/*.spec.ts'
      - '**/*.e2e-spec.ts'
  - name: JSUnusedLocalSymbols
    paths:
      - '**/*.spec.ts'
      - '**/*.e2e-spec.ts'
  - name: JSUnusedAssignment
    paths:
      - '**/*.spec.ts'
      - '**/*.e2e-spec.ts'
  - name: TypeScriptExplicitMemberType
    paths:
      - '**/*.spec.ts'
      - '**/*.e2e-spec.ts'
  - name: MagicNumberJS
    paths:
      - '**/*.spec.ts'
      - '**/*.e2e-spec.ts'

# Bootstrap: ensures dependencies for ESLint + TS resolution
bootstrap: pnpm install --frozen-lockfile

# === Quality Gate ===
failureConditions:
  severityThresholds:
    any: 50
    critical: 10
    high: 30

linter: jetbrains/qodana-js:2026.1
